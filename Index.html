<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С Днём Рождения! 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --red-dark: #6b0010;
  --red-mid: #cc0020;
  --red-glow: #ff1a3a;
  --gold: #c8943a;
  --bg: #070003;
  --surface: #12000a;
  --text: #ffe8e8;
}
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: radial-gradient(ellipse at 30% 20%, #1c0008 0%, #0a0003 50%, #000000 100%);
  min-height: 100vh;
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  overflow-x: hidden;
}

/* ── Spider lily background SVGs ── */
.bg-flowers {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  overflow: hidden;
}
.bg-lily {
  position: absolute;
  opacity: 0.18;
  animation: lilyDrift 8s ease-in-out infinite;
}
.bg-lily:nth-child(1) { top:-20px; left:-20px; width:160px; animation-delay:0s; }
.bg-lily:nth-child(2) { top:-10px; right:-10px; width:140px; animation-delay:1.5s; }
.bg-lily:nth-child(3) { bottom:0; left:5%; width:130px; animation-delay:3s; transform: scaleY(-1); }
.bg-lily:nth-child(4) { bottom:-10px; right:5%; width:150px; animation-delay:0.8s; transform: scaleY(-1) scaleX(-1); }
.bg-lily:nth-child(5) { top:40%; left:-10px; width:100px; animation-delay:2s; opacity:0.1; }
.bg-lily:nth-child(6) { top:35%; right:-10px; width:110px; animation-delay:4s; opacity:0.1; }
@keyframes lilyDrift {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-12px) rotate(5deg); }
}
.bg-lily:nth-child(3) { animation-name: lilyDriftFlip; }
.bg-lily:nth-child(4) { animation-name: lilyDriftFlip2; }
@keyframes lilyDriftFlip {
  0%,100% { transform: scaleY(-1) translateY(0) rotate(0deg); }
  50% { transform: scaleY(-1) translateY(-12px) rotate(-5deg); }
}
@keyframes lilyDriftFlip2 {
  0%,100% { transform: scaleY(-1) scaleX(-1) translateY(0) rotate(0deg); }
  50% { transform: scaleY(-1) scaleX(-1) translateY(-12px) rotate(5deg); }
}

/* Floating petals */
.petal {
  position: fixed;
  width: 8px; height: 20px;
  background: linear-gradient(180deg, #cc0020, #8b0010);
  border-radius: 60% 40% 60% 40%;
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  animation: petalFall linear infinite;
}
@keyframes petalFall {
  0% { transform: translateY(-30px) rotate(0deg); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.4; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ── Main layout ── */
.container {
  position: relative; z-index: 1;
  max-width: 820px; margin: 0 auto;
  padding: 30px 20px 60px;
  text-align: center;
}

/* ── Title ── */
.title {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(2.2em, 6vw, 4em);
  color: var(--red-glow);
  text-shadow: 0 0 15px rgba(255,26,58,0.8), 0 0 40px rgba(255,26,58,0.4), 0 0 80px rgba(200,0,30,0.3);
  margin-bottom: 6px;
  animation: titleGlow 3s ease-in-out infinite alternate;
}
@keyframes titleGlow {
  from { text-shadow: 0 0 15px rgba(255,26,58,0.8), 0 0 40px rgba(255,26,58,0.4); }
  to { text-shadow: 0 0 25px rgba(255,26,58,1), 0 0 60px rgba(255,26,58,0.7), 0 0 100px rgba(200,0,30,0.5); }
}

.subtitle {
  font-family: 'Dancing Script', cursive;
  font-size: 1.3em;
  color: var(--gold);
  margin-bottom: 18px;
  opacity: 0.9;
}

/* ── Countdown ── */
.countdown {
  display: inline-block;
  background: rgba(139,0,16,0.25);
  border: 1px solid rgba(204,0,32,0.4);
  border-radius: 50px;
  padding: 8px 24px;
  font-size: 0.95em;
  color: #ffccd5;
  margin-bottom: 30px;
  backdrop-filter: blur(4px);
  letter-spacing: 0.04em;
}

/* ── Character ── */
.char-wrapper {
  width: 200px; margin: 0 auto 30px;
  filter: drop-shadow(0 0 18px rgba(204,0,32,0.35));
}

/* ── Balloon instruction ── */
.instr {
  font-size: 1.05em;
  color: rgba(255,232,232,0.75);
  margin-bottom: 28px;
  letter-spacing: 0.06em;
}

/* ── Balloons ── */
.balloons-row {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: clamp(10px, 3vw, 32px);
  flex-wrap: nowrap;
  margin-bottom: 50px;
  padding: 0 10px;
}

.balloon-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.balloon-item:hover { transform: scale(1.08); }
.balloon-item:hover .balloon-body { filter: brightness(1.15); }

.balloon-body {
  width: 62px; height: 75px;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  position: relative;
  transition: filter 0.2s;
  animation: floatUp 3s ease-in-out infinite;
}
.balloon-body::before {
  content: '';
  position: absolute;
  bottom: -3px; left: 50%; transform: translateX(-50%);
  width: 12px; height: 8px;
  background: inherit;
  clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
  border-radius: 0 0 4px 4px;
}
.balloon-string {
  width: 1.5px; height: 40px;
  background: linear-gradient(180deg, #aaa, #666);
  margin-top: 0;
}
.balloon-num {
  font-weight: 700;
  font-size: 1.3em;
  color: var(--text);
  margin-top: 5px;
  text-shadow: 0 0 8px rgba(255,26,58,0.6);
}

.balloon-item:nth-child(1) .balloon-body { background: radial-gradient(circle at 35% 35%, #ff4060, #cc0020, #7a0010); }
.balloon-item:nth-child(2) .balloon-body { background: radial-gradient(circle at 35% 35%, #ff6080, #dd1535, #8b0018); }
.balloon-item:nth-child(3) .balloon-body { background: radial-gradient(circle at 35% 35%, #e83050, #bb0020, #700015); }
.balloon-item:nth-child(4) .balloon-body { background: radial-gradient(circle at 35% 35%, #ff3355, #c81030, #7f0015); }
.balloon-item:nth-child(5) .balloon-body { background: radial-gradient(circle at 35% 35%, #c8943a, #a0700a, #6b4800); }

.balloon-item:nth-child(1) .balloon-body { animation-delay: 0s; }
.balloon-item:nth-child(2) .balloon-body { animation-delay: 0.5s; }
.balloon-item:nth-child(3) .balloon-body { animation-delay: 1s; }
.balloon-item:nth-child(4) .balloon-body { animation-delay: 1.5s; }
.balloon-item:nth-child(5) .balloon-body { animation-delay: 0.25s; }

@keyframes floatUp {
  0%,100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-18px) rotate(4deg); }
}

/* Shine on balloon */
.balloon-body::after {
  content: '';
  position: absolute;
  top: 12px; left: 12px;
  width: 18px; height: 24px;
  background: rgba(255,255,255,0.25);
  border-radius: 50%;
  transform: rotate(-30deg);
}

/* ── Modal ── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s;
  backdrop-filter: blur(6px);
}
.modal-bg.open {
  opacity: 1;
  pointer-events: all;
}
.modal-box {
  background: linear-gradient(145deg, #1a0008 0%, #2d0010 60%, #1a0005 100%);
  border: 2px solid rgba(204,0,32,0.55);
  border-radius: 22px;
  padding: 36px 32px 32px;
  max-width: 480px;
  width: 92%;
  text-align: center;
  box-shadow: 0 0 60px rgba(204,0,32,0.45), inset 0 0 40px rgba(139,0,16,0.15);
  position: relative;
  transform: scale(0.85);
  transition: transform 0.35s;
}
.modal-bg.open .modal-box {
  transform: scale(1);
}
.modal-close {
  position: absolute; top: 14px; right: 18px;
  font-size: 1.4em; cursor: pointer;
  color: rgba(255,100,100,0.7);
  transition: color 0.2s;
  background: none; border: none;
  line-height: 1;
}
.modal-close:hover { color: var(--red-glow); }

.modal-emoji { font-size: 2.5em; margin-bottom: 14px; display: block; }

.modal-msg {
  font-family: 'Dancing Script', cursive;
  font-size: 1.55em;
  line-height: 1.65;
  color: #ffe4e8;
  text-shadow: 0 0 12px rgba(255,80,100,0.3);
  margin-bottom: 8px;
}
.modal-img-wrap {
  margin-top: 16px;
  border-radius: 16px;
  overflow: hidden;
  border: 2px solid rgba(204,0,32,0.5);
  box-shadow: 0 0 30px rgba(204,0,32,0.3);
}
.modal-img-wrap img { width: 100%; display: block; }
.modal-img-caption {
  margin-top: 12px;
  font-size: 1em;
  color: rgba(255,220,220,0.8);
}

/* Pop animation for burst */
.balloon-pop-fx {
  position: fixed;
  pointer-events: none;
  z-index: 199;
  font-size: 2em;
  animation: popFx 0.7s ease-out forwards;
}
@keyframes popFx {
  0% { transform: scale(0) rotate(0deg); opacity: 1; }
  60% { transform: scale(1.8) rotate(20deg); opacity: 1; }
  100% { transform: scale(2.5) rotate(-10deg); opacity: 0; }
}

/* ARM WAVE ANIMATION */
@keyframes armWave {
  0%,100% { transform: rotate(-5deg); }
  50% { transform: rotate(22deg); }
}
#rightArmRotateGroup {
  transform-box: fill-box;
  transform-origin: 0% 0%;
  animation: armWave 2s ease-in-out infinite;
}

/* Candle flame flicker */
@keyframes flicker {
  0%,100% { opacity: 1; transform: scale(1) skewX(0deg); }
  25% { opacity: 0.85; transform: scale(1.05, 0.95) skewX(3deg); }
  50% { opacity: 0.9; transform: scale(0.95, 1.05) skewX(-2deg); }
  75% { opacity: 1; transform: scale(1.02) skewX(2deg); }
}
.flame-outer { animation: flicker 0.4s ease-in-out infinite; transform-origin: 50% 100%; }
.flame-glow { animation: flicker 0.6s ease-in-out infinite reverse; }

/* Responsive */
@media(max-width: 480px) {
  .balloon-body { width: 52px; height: 63px; }
  .balloons-row { gap: 8px; }
}
</style>
